name: SonarQube scan

inputs:
  sonar-token:
    description: Access token for SonarQube
    required: true
  sonar-host-url:
    description: SonarQube URL
    required: true

runs:
  using: "composite"
  steps:
    # A push to a branch with an open PR is analysed as that PR, so SonarQube decorates it.
    - name: Check PR
      uses: 8BitJonny/gh-get-current-pr@4.0.0
      id: checkPr
      with:
        filterOutClosed: true
        sha: ${{ github.event.pull_request.head.sha }}

    - name: Create sonar-project.properties
      uses: actions/github-script@v9
      env:
        # The PR and the branch name reach the script through the environment. A quote in a branch name
        # would otherwise end a string in the script and run the rest as code.
        PR_JSON: ${{ steps.checkPr.outputs.pr }}
        BRANCH_NAME: ${{ github.ref_name }}
      with:
        script: |
          const fs = require('fs');

          // It must be an absolute path to support ESM import (https://github.com/actions/github-script?tab=readme-ov-file#use-esm-import).
          const localConfigPath = `${process.env.GITHUB_WORKSPACE}/sonar-project.properties.mjs`;

          if (!fs.existsSync(localConfigPath)) {
            console.log(`No sonar-project.properties.mjs found (checked using path ${localConfigPath})`);
            return;
          } else {
            console.log(`Found sonar-project.properties.mjs at ${localConfigPath}`);
          }

          const pr = process.env.PR_JSON ? JSON.parse(process.env.PR_JSON) : undefined;

          let config = {
            'sonar.projectVersion': process.env.GITHUB_SHA,
          };

          // There must not be any `sonar.branch` properties like `sonar.branch.name` arguments set when you analyze a pull-request.
          // These properties indicate to sonar that a branch is being analyzed rather than a pull-request so no pull-request decoration will be executed.
          if (pr) {
            config = {
              ...config,
              'sonar.pullrequest.key': pr.number,
              'sonar.pullrequest.branch': pr.head.ref,
              'sonar.pullrequest.base': pr.base.ref,
              'sonar.pullrequest.github.repository': process.env.GITHUB_REPOSITORY,
            };
          } else {
            config['sonar.branch.name'] = process.env.BRANCH_NAME;
          }

          try {
            const { default: importedLocalConfig } = await import(localConfigPath);
            config = { ...config, ...importedLocalConfig };
          } catch (importError) {
            console.error(importError);
            console.log(`Could not import sonar-project.properties.mjs; a default configuration will be used`);
          }

          console.log('SonarQube config:', config);

          const lines = Object.entries(config)
            .filter(([, v]) => v)
            .map(([k, v]) => `${k}=${v}`)
            .join('\n');

          fs.writeFileSync('./sonar-project.properties', lines);

    - name: SonarQube scan
      uses: SonarSource/sonarqube-scan-action@v8.3.0
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

    # A red Quality Gate fails this step, so the commit shows a failed check.
    - name: SonarQube quality gate
      uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

    - name: Remove sonar-project.properties
      if: always()
      run: rm -f sonar-project.properties
      shell: bash

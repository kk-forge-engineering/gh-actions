name: SonarQube scan

inputs:
  sonar-token:
    description: Access token for SonarQube
    required: true
  sonar-host-url:
    description: SonarQube URL
    required: true

runs:
  using: "composite"
  steps:
    # The scanner reads the repo's sonar-project.properties and takes these properties on top, as JSON in
    # SONARQUBE_SCANNER_PARAMS. A push to a branch with an open PR is analysed as that PR, so SonarQube
    # decorates it.
    - name: Name the branch or PR
      uses: actions/github-script@v9
      env:
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        script: |
          const commit = process.env.COMMIT_SHA;
          const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            ...context.repo,
            commit_sha: commit,
          });
          const pr = pullRequests.find((candidate) => candidate.state === 'open' && candidate.head.sha === commit);
          // A branch property makes SonarQube analyse a branch, so a PR analysis must not carry one.
          const params = pr
            ? {
                'sonar.pullrequest.key': String(pr.number),
                'sonar.pullrequest.branch': pr.head.ref,
                'sonar.pullrequest.base': pr.base.ref,
                'sonar.pullrequest.github.repository': process.env.GITHUB_REPOSITORY,
              }
            : { 'sonar.branch.name': process.env.GITHUB_REF_NAME };
          params['sonar.projectVersion'] = commit;
          console.log('SonarQube parameters:', params);
          core.exportVariable('SONARQUBE_SCANNER_PARAMS', JSON.stringify(params));

    # The scan action checks the scanner's signature, and gpg fetches SonarSource's key through dirmngr. The
    # self-hosted runner's image ships gpg without dirmngr.
    - name: Install dirmngr
      if: runner.os == 'Linux'
      shell: bash
      run: command -v dirmngr >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dirmngr; }

    - name: SonarQube scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

    # A red Quality Gate fails this step, so the commit shows a failed check.
    - name: SonarQube quality gate
      uses: SonarSource/sonarqube-quality-gate-action@v1
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

name: SonarQube scan

inputs:
  sonar-token:
    description: Access token for SonarQube
    required: true
  sonar-host-url:
    description: SonarQube URL
    required: true

runs:
  using: "composite"
  steps:
    # A push to a branch with an open PR is analysed as that PR, so SonarQube decorates it.
    - name: Check PR
      uses: 8BitJonny/gh-get-current-pr@4.0.0
      id: checkPr
      with:
        filterOutClosed: true
        sha: ${{ github.event.pull_request.head.sha }}

    # The scanner reads the repo's sonar-project.properties and takes these properties on top, as JSON in
    # SONARQUBE_SCANNER_PARAMS. JSON keeps a branch name intact whatever characters it holds.
    - name: Name the branch or PR
      uses: actions/github-script@v9
      env:
        PR_JSON: ${{ steps.checkPr.outputs.pr }}
      with:
        script: |
          const pr = process.env.PR_JSON ? JSON.parse(process.env.PR_JSON) : undefined;
          // A branch property makes SonarQube analyse a branch, so a PR analysis must not carry one.
          const params = pr
            ? {
                'sonar.pullrequest.key': String(pr.number),
                'sonar.pullrequest.branch': pr.head.ref,
                'sonar.pullrequest.base': pr.base.ref,
                'sonar.pullrequest.github.repository': process.env.GITHUB_REPOSITORY,
              }
            : { 'sonar.branch.name': process.env.GITHUB_REF_NAME };
          params['sonar.projectVersion'] = process.env.GITHUB_SHA;
          console.log('SonarQube parameters:', params);
          core.exportVariable('SONARQUBE_SCANNER_PARAMS', JSON.stringify(params));

    - name: SonarQube scan
      uses: SonarSource/sonarqube-scan-action@v8.3.0
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

    # A red Quality Gate fails this step, so the commit shows a failed check.
    - name: SonarQube quality gate
      uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

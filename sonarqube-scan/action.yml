name: SonarQube scan

inputs:
  sonar-token:
    description: Access token for SonarQube
    required: true
  sonar-host-url:
    description: SonarQube URL
    required: true

runs:
  using: "composite"
  steps:
    # The scanner reads the repo's sonar-project.properties and takes these properties on top, as JSON in
    # SONARQUBE_SCANNER_PARAMS. A PR event, or a push to a branch with an open PR, is analysed as that PR, so
    # SonarQube decorates it.
    - name: Name the branch or PR
      uses: actions/github-script@v9
      env:
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
      with:
        script: |
          const commit = process.env.COMMIT_SHA;
          const findOpenPr = async () => {
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: commit,
            });
            return pullRequests.find((candidate) => candidate.state === 'open' && candidate.head.sha === commit);
          };
          // A PR event names its PR, which the lookup by commit can miss while GitHub indexes a new PR.
          const pr = context.payload.pull_request ?? await findOpenPr();
          // A branch property makes SonarQube analyse a branch, so a PR analysis must not carry one.
          const params = pr
            ? {
                'sonar.pullrequest.key': String(pr.number),
                'sonar.pullrequest.branch': pr.head.ref,
                'sonar.pullrequest.base': pr.base.ref,
                'sonar.pullrequest.github.repository': process.env.GITHUB_REPOSITORY,
              }
            : { 'sonar.branch.name': process.env.GITHUB_REF_NAME };
          params['sonar.projectVersion'] = commit;
          // The host goes in too, so a sonar.host.url in sonar-project.properties cannot override it.
          params['sonar.host.url'] = process.env.SONAR_HOST_URL;
          console.log('SonarQube parameters:', params);
          core.exportVariable('SONARQUBE_SCANNER_PARAMS', JSON.stringify(params));

    # The scan action checks the scanner's signature, and gpg fetches SonarSource's key through dirmngr. The
    # self-hosted runner's image ships gpg without dirmngr.
    - name: Install dirmngr
      if: runner.os == 'Linux'
      shell: bash
      run: command -v dirmngr >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dirmngr; }

    - name: SonarQube scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

    # A red Quality Gate fails this step, so the commit shows a failed check.
    - id: gate
      name: SonarQube quality gate
      uses: SonarSource/sonarqube-quality-gate-action@v1
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}

    # The quality gate action says only that the gate failed. This step lists why in the log, the job summary and
    # annotations, so a red gate reads without a SonarQube login.
    - name: Show why the quality gate failed
      if: ${{ failure() && steps.gate.outcome == 'failure' && hashFiles('.scannerwork/report-task.txt') != '' }}
      uses: actions/github-script@v9
      env:
        # Inside github-script, GITHUB_ACTION_PATH names github-script's own directory, not this action's.
        ACTION_PATH: ${{ github.action_path }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      with:
        script: |
          await require(`${process.env.ACTION_PATH}/gate-report.js`)({
            core,
            host: process.env.SONAR_HOST_URL,
            token: process.env.SONAR_TOKEN,
            reportTask: require('fs').readFileSync('.scannerwork/report-task.txt', 'utf8'),
          });

# Runs a repo's tests with coverage and sends the result to SonarQube. The repo keeps its own tools in
# mise.toml and its Sonar settings in sonar-project.properties at its root. The caller passes the
# secret SONAR_TOKEN.
name: Sonar

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner labels as JSON, such as '["self-hosted","swarm"]' or '"ubuntu-24.04"'
        required: true
        type: string
      test-command:
        description: The command that runs the tests and writes the coverage reports Sonar reads
        required: true
        type: string
      sonar-host-url:
        description: The SonarQube URL
        type: string
        default: https://sq.kk-forge.com
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube reads the history to tell new code from old.
          fetch-depth: 0

      - name: Install the tools from mise.toml
        uses: jdx/mise-action@v5.2.3

      - name: Test with coverage
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"

      - name: SonarQube scan
        uses: kk-forge-engineering/github-actions/sonarqube-scan@v1
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ inputs.sonar-host-url }}

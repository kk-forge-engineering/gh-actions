# Builds a package's images under the version its `version-task` prints, pushes them to dr.kk-forge.com and publishes
# a GitHub Release listing them. Called as a job of the caller's CI (README.md).
name: Release image

on:
  workflow_call:
    inputs:
      images:
        description: One image per line, `<name> <context> <Dockerfile>`, such as `my-service . Dockerfile`; <name> is its repository in dr.kk-forge.com
        type: string
        required: true
      version-task:
        description: The caller's mise task that prints the package's version, X.Y.Z, such as `version` or `backend:version`
        type: string
        required: true
      tag-prefix:
        description: Goes before `v<version>` in the tag, such as `backend-` in a repo of several packages
        type: string
        default: ""
      dev:
        description: Release X.Y.Z-dev.N from the current branch, instead of X.Y.Z from the default branch
        type: boolean
        default: false
      hosted:
        description: Build on a GitHub-hosted runner even for a private repo, for an image the self-hosted runners must not build, such as the one that starts them
        type: boolean
        default: false
    secrets:
      DOCKER_REGISTRY_TOKEN:
        description: The token the registry user named after the calling repo logs in with
        required: true

jobs:
  # The caller's tools run only in this job, which holds no registry token and no write token.
  version:
    # A public repo, or a caller that sets `hosted`, runs on a GitHub-hosted runner. A pull request from a fork must
    # never run code on the kk-forge server.
    runs-on: ${{ github.event.repository.private && !inputs.hosted && fromJSON('["self-hosted","swarm"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      IS_DEV: ${{ inputs.dev }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags show whether this version is released already.
          fetch-depth: 0
          persist-credentials: false

      # Node 26's binary links libatomic, which the self-hosted runner's image lacks, so mise fails to install it.
      - name: Install libatomic1
        if: runner.os == 'Linux'
        run: ldconfig -p | grep -q libatomic.so.1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libatomic1; }

      # mise-action installs the tools fresh, not from the gha cache, which any workflow of the repo can write.
      - name: Install the tools from mise.toml
        uses: jdx/mise-action@v5
        with:
          cache: false

      - name: Pick the version
        id: version
        env:
          VERSION_TASK: ${{ inputs.version-task }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$IS_DEV" != true ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::A stable release comes from $DEFAULT_BRANCH. Release a dev version from $GITHUB_REF_NAME."
            exit 1
          fi
          if ! [[ "$VERSION_TASK" =~ ^[A-Za-z0-9][A-Za-z0-9:._-]*$ && "$TAG_PREFIX" =~ ^([a-z0-9][a-z0-9._-]*)?$ ]]; then
            echo "::error::version-task is a mise task name and tag-prefix is empty or such as backend-"
            exit 1
          fi
          version=$(mise run --quiet "$VERSION_TASK")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::mise run $VERSION_TASK printed «${version}», not one X.Y.Z line"
            exit 1
          fi
          if [ "$IS_DEV" = true ]; then
            version="$version-dev.$GITHUB_RUN_NUMBER"
          fi
          tag="${TAG_PREFIX}v$version"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # A tag never moves. A merge that keeps the version releases nothing and stays green.
          if tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            if [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "$tag is already released from this commit"
            else
              echo "::warning::$tag is already released from ${tagged:0:7}, so this commit releases nothing. Raise the version that mise run $VERSION_TASK prints."
            fi
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing $tag"
          echo "release=true" >>"$GITHUB_OUTPUT"

  release:
    needs: version
    if: ${{ needs.version.outputs.release == 'true' }}
    runs-on: ${{ github.event.repository.private && !inputs.hosted && fromJSON('["self-hosted","swarm"]') || 'ubuntu-24.04' }}
    # One release at a time per kind: GitHub drops an older pending run for a newer one in the same group.
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.dev && 'dev' || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      IS_DEV: ${{ inputs.dev }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      # Any workflow of the repo can write the gha cache, so only a public repo's dev build reads it. A private repo
      # builds without it, on the kk-forge runner or, with `hosted`, on a hosted one.
      SHOULD_USE_GHA_CACHE: ${{ !github.event.repository.private && inputs.dev }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The Release API creates the tag, so the write token stays out of .git/config.
          persist-credentials: false

      # A run that waited for the group may find its tag released by the run before it.
      - name: Check the version is still free
        id: free
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          VERSION_TASK: ${{ inputs.version-task }}
        run: |
          set -euo pipefail
          # This check validates the version job's outputs again: the caller's task ran in that job and could have
          # written any of them.
          suffix=''
          [ "$IS_DEV" != true ] || suffix="-dev\\.$GITHUB_RUN_NUMBER"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+${suffix}$ && "$TAG" == "${TAG_PREFIX}v$VERSION" ]]; then
            echo "::error::The version job passed «${VERSION}» and «${TAG}»"
            exit 1
          fi
          if tagged=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "$TAG was released from this commit while this run waited"
            else
              echo "::warning::$TAG was released from ${tagged:0:7} while this run waited, so this commit releases nothing. Raise the version that mise run $VERSION_TASK prints."
            fi
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi

      # GitHub hands the cache token only to actions. This step runs before the login, so the registry token is not on
      # disk while it runs.
      - name: Expose the cache token to buildx
        if: ${{ steps.free.outputs.release == 'true' && env.SHOULD_USE_GHA_CACHE == 'true' }}
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Log in to dr.kk-forge.com
        if: ${{ steps.free.outputs.release == 'true' }}
        env:
          DOCKER_REGISTRY_USER: ${{ github.event.repository.name }}
          DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # An empty secret makes docker login ask interactively and fail with a message about a TTY.
          if [ -z "$DOCKER_REGISTRY_TOKEN" ]; then
            echo "::error::No DOCKER_REGISTRY_TOKEN: this repo needs a registry user named $DOCKER_REGISTRY_USER and that secret"
            exit 1
          fi
          printf '%s' "$DOCKER_REGISTRY_TOKEN" | docker login dr.kk-forge.com --username "$DOCKER_REGISTRY_USER" --password-stdin

      - name: Build and push
        id: build
        if: ${{ steps.free.outputs.release == 'true' }}
        env:
          IMAGES: ${{ inputs.images }}
          IS_ON_KK_FORGE: ${{ github.event.repository.private && !inputs.hosted }}
        run: |
          set -euo pipefail
          names=() contexts=() dockerfiles=()
          while read -r name context dockerfile rest; do
            [ -n "$name" ] || continue
            if ! [[ "$name" =~ ^[a-z0-9][a-z0-9._-]*$ && -n "$context" && -n "$dockerfile" && -z "$rest" ]]; then
              echo "::error::An images line is <name> <context> <Dockerfile>, not: $name $context $dockerfile $rest"
              exit 1
            fi
            for other in "${names[@]}"; do
              [ "$other" != "$name" ] || { echo "::error::$name is listed twice"; exit 1; }
            done
            names+=("$name") contexts+=("$context") dockerfiles+=("$dockerfile")
          done <<<"$IMAGES"
          [ "${#names[@]}" -gt 0 ] || { echo "::error::images lists no image"; exit 1; }
          if [ "$IS_ON_KK_FORGE" = true ]; then
            # The launcher gives each kk-forge runner its own buildkitd at BUILDKIT_HOST.
            if [ -z "${BUILDKIT_HOST:-}" ]; then
              echo "::error::No BUILDKIT_HOST: a private repo builds only on the kk-forge runner"
              exit 1
            fi
            docker buildx create --name kk-forge --driver remote "$BUILDKIT_HOST" --use
          else
            # This step names the driver, so buildx ignores a BUILDKIT_HOST in the runner's environment.
            docker buildx create --name kk-forge --driver docker-container --use
          fi
          # The registry never overwrites a tag, so a version already there, even from a failed run, fails the run, and the
          # message names the fix. A rerun keeps the run number, so a dev run needs a new run rather than a raise.
          fix="Raise the version that the version task prints."
          [ "$IS_DEV" != true ] || fix="Start a new run, which takes the next run number."
          for name in "${names[@]}"; do
            ref=dr.kk-forge.com/$name:$VERSION
            if found=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "::error::$ref is already in the registry. $fix"
              exit 1
            elif ! grep -qi 'not found' <<<"$found"; then
              echo "::error::Could not check $ref in the registry: $found"
              exit 1
            fi
          done
          refs=()
          for i in "${!names[@]}"; do
            ref=dr.kk-forge.com/${names[$i]}:$VERSION
            cache=()
            if [ "$SHOULD_USE_GHA_CACHE" = true ]; then
              cache=(--cache-from "type=gha,scope=dev/${names[$i]}" --cache-to "type=gha,scope=dev/${names[$i]},mode=max")
            fi
            # --provenance=false pushes a plain manifest, so the digest is the image itself.
            docker buildx build "${contexts[$i]}" --file "${dockerfiles[$i]}" --platform linux/amd64 --push --provenance=false \
              --tag "$ref" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "${cache[@]}" \
              --metadata-file "$RUNNER_TEMP/build.json"
            digest=$(sed -n 's/^ *"containerimage.digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' "$RUNNER_TEMP/build.json")
            if [ -z "$digest" ]; then
              echo "::error::The build of ${names[$i]} reported no image digest"
              exit 1
            fi
            echo "Pushed $ref as $digest"
            refs+=("$ref")
          done
          echo "refs=${refs[*]}" >>"$GITHUB_OUTPUT"

      - name: Publish the release
        if: ${{ steps.free.outputs.release == 'true' }}
        env:
          REFS: ${{ steps.build.outputs.refs }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A reference holds no quote or backslash, so it goes into the JSON as it is.
          # shellcheck disable=SC2016
          text='```\n'"${REFS// /\\n}"'\n```'
          body=$(printf '{"tag_name":"%s","target_commitish":"%s","name":"%s","body":"%s","prerelease":%s,"make_latest":"%s","generate_release_notes":true}' \
            "$TAG" "$GITHUB_SHA" "$TAG" "$text" "$IS_DEV" "$([ "$IS_DEV" = true ] && echo false || echo true)")
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" -d "$body" >/dev/null
          echo "Released $TAG: $REFS" | tee -a "$GITHUB_STEP_SUMMARY"

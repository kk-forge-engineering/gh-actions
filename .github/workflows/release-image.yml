# Builds a repo's images, pushes each to dr.kk-forge.com under one version, and publishes a GitHub Release
# `v<version>` whose body lists each image as dr.kk-forge.com/<name>@sha256:<digest>. project-orchestration's
# `mise run deploy:<stack>` takes those references. A stable X.Y.Z comes from the default branch only, and also
# moves `latest`. A dev X.Y.Z-dev.N comes from any branch.
name: Release image

on:
  workflow_call:
    inputs:
      images:
        description: One image per line, `<name> <context> <Dockerfile>`, such as `my-service . Dockerfile`; <name> is its repository in dr.kk-forge.com
        type: string
        default: ""
      image:
        description: A single image's repository in dr.kk-forge.com, built from `context` and `dockerfile`; give it or `images`
        type: string
        default: ""
      bump:
        description: patch, minor or major, applied to the highest stable version tag
        type: string
        default: patch
      dev:
        description: Release X.Y.Z-dev.N from the current branch, instead of X.Y.Z from the default branch
        type: boolean
        default: false
      context:
        description: The build context of `image`
        type: string
        default: .
      dockerfile:
        description: The Dockerfile of `image`, relative to the repo root
        type: string
        default: Dockerfile
    secrets:
      DOCKER_REGISTRY_PASSWORD:
        description: The password of the registry user named after the calling repo
        required: true

jobs:
  release:
    # A public repo never runs on the kk-forge runner, as in ci.yml: a pull request from a fork would run someone
    # else's code on the kk-forge server. So a public repo builds on a hosted runner.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","swarm"]') || 'ubuntu-24.04' }}
    # Two releases at once would pick the same version and both push its tag.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      IS_DEV: ${{ inputs.dev }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from the tags.
          fetch-depth: 0
          # No step runs git with credentials: the Release API creates the tag. So the write token stays out of
          # .git/config, out of reach of the third-party action below.
          persist-credentials: false

      - name: Pick the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$IS_DEV" != true ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::A stable release comes from $DEFAULT_BRANCH. Release a dev version from $GITHUB_REF_NAME."
            exit 1
          fi
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          IFS=. read -r major minor patch <<<"${latest#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
            *) echo "::error::bump is patch, minor or major, not $BUMP"; exit 1 ;;
          esac
          if [ "$IS_DEV" = true ]; then
            version="$version-dev.$GITHUB_RUN_NUMBER"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released"
            exit 1
          fi
          echo "Releasing $version after ${latest:-no stable release}"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # The gha cache needs the job's cache token, which GitHub hands only to actions, not to run steps. It runs
      # before the registry login, so the registry password is not on disk yet.
      - name: Expose the cache token to buildx
        if: ${{ !github.event.repository.private && inputs.dev }}
        uses: crazy-max/ghaction-github-runtime@v3

      # Each repo has a registry user of its own name, so one repo's password can be rotated or revoked alone.
      - name: Log in to dr.kk-forge.com
        env:
          DOCKER_REGISTRY_USER: ${{ github.event.repository.name }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: printf '%s' "$DOCKER_REGISTRY_PASSWORD" | docker login dr.kk-forge.com --username "$DOCKER_REGISTRY_USER" --password-stdin

      - name: Build and push
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGES: ${{ inputs.images }}
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if { [ -n "$IMAGES" ] && [ -n "$IMAGE" ]; } || { [ -z "$IMAGES" ] && [ -z "$IMAGE" ]; }; then
            echo "::error::Give images or image, one of the two"
            exit 1
          fi
          [ -n "$IMAGES" ] || IMAGES="$IMAGE $CONTEXT $DOCKERFILE"
          names=() contexts=() dockerfiles=()
          while read -r name context dockerfile rest; do
            [ -n "$name" ] || continue
            if ! [[ "$name" =~ ^[a-z0-9][a-z0-9._-]*$ && -n "$context" && -n "$dockerfile" && -z "$rest" ]]; then
              echo "::error::An images line is <name> <context> <Dockerfile>, not: $name $context $dockerfile $rest"
              exit 1
            fi
            for other in "${names[@]}"; do
              [ "$other" != "$name" ] || { echo "::error::$name is listed twice"; exit 1; }
            done
            names+=("$name") contexts+=("$context") dockerfiles+=("$dockerfile")
          done <<<"$IMAGES"
          [ "${#names[@]}" -gt 0 ] || { echo "::error::images lists no image"; exit 1; }
          if [ "$IS_PRIVATE" = true ]; then
            # The launcher gives each kk-forge runner its own buildkitd at BUILDKIT_HOST.
            if [ -z "${BUILDKIT_HOST:-}" ]; then
              echo "::error::No BUILDKIT_HOST: a private repo builds only on the kk-forge runner"
              exit 1
            fi
            docker buildx create --name kk-forge --driver remote "$BUILDKIT_HOST" --use
          else
            docker buildx create --name kk-forge --use
          fi
          # A version is taken only once its git tag exists, which the previous step refuses. A registry tag
          # <name>:<version> without that git tag is left by a run that failed before its Release, and this build
          # overwrites it. A deploy pins the digest from the Release, so the overwritten image was never deployed.
          refs=()
          for i in "${!names[@]}"; do
            repository=dr.kk-forge.com/${names[$i]}
            tags=(--tag "$repository:$VERSION")
            # The cache never lives in the registry: every repo's CI user can write every repository there, so one
            # repo's CI could poison another's build. A stable release builds with no shared cache either: any
            # workflow of this repo can write its gha cache, ci.yml's third-party install scripts included. The
            # kk-forge runner's buildkitd starts empty for each job. Only a dev release on a hosted runner uses the
            # gha cache, so a poisoned layer can reach only a dev image.
            cache=()
            if [ "$IS_PRIVATE" != true ] && [ "$IS_DEV" = true ]; then
              cache=(--cache-from "type=gha,scope=dev/${names[$i]}" --cache-to "type=gha,scope=dev/${names[$i]},mode=max")
            fi
            if [ "$IS_DEV" != true ]; then
              # latest moves to each stable release, for a pull by hand.
              tags+=(--tag "$repository:latest")
            fi
            # --provenance=false pushes a plain manifest, so the digest is the image itself.
            docker buildx build "${contexts[$i]}" --file "${dockerfiles[$i]}" --platform linux/amd64 --push --provenance=false \
              "${tags[@]}" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "${cache[@]}" \
              --metadata-file "$RUNNER_TEMP/build.json"
            digest=$(sed -n 's/^ *"containerimage.digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' "$RUNNER_TEMP/build.json")
            if [ -z "$digest" ]; then
              echo "::error::The build of ${names[$i]} reported no image digest"
              exit 1
            fi
            echo "Pushed $repository:$VERSION as $digest"
            refs+=("$repository@$digest")
          done
          echo "refs=${refs[*]}" >>"$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REFS: ${{ steps.build.outputs.refs }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The body lists one reference per line in a code block, ready to pass to `mise run deploy:<stack> --`. A
          # reference holds no quote or backslash, so it goes into the JSON as it is, with \n between lines.
          # shellcheck disable=SC2016
          text='```\n'"${REFS// /\\n}"'\n```'
          body=$(printf '{"tag_name":"v%s","target_commitish":"%s","name":"v%s","body":"%s","prerelease":%s,"make_latest":"%s","generate_release_notes":true}' \
            "$VERSION" "$GITHUB_SHA" "$VERSION" "$text" "$IS_DEV" "$([ "$IS_DEV" = true ] && echo false || echo true)")
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" -d "$body" >/dev/null
          echo "Released v$VERSION: $REFS" | tee -a "$GITHUB_STEP_SUMMARY"

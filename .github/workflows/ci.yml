# Runs a repo's `mise run setup` and `check:ci`, then its SonarQube scan when it has a sonar-project.properties.
# Called from each repo's CI (README.md), and run on this repo's own pushes.
name: CI

on:
  workflow_call:
    inputs:
      hosted:
        description: Run on a GitHub-hosted runner even for a private repo, as release-image.yml's `hosted` does, so the caller's CI runs while the self-hosted runners are down
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
  push:
    branches: ["**"]

jobs:
  ci:
    # A public repo, or a caller that sets `hosted`, runs on a GitHub-hosted runner. A pull request from a fork must
    # never run code on the kk-forge server.
    runs-on: ${{ github.event.repository.private && !inputs.hosted && fromJSON('["self-hosted","swarm"]') || 'ubuntu-24.04' }}
    # A newer push makes this run moot. The event keeps a manual dev run and a push from cancelling each other.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube reads the history to tell new code from old.
          fetch-depth: 0
          # `setup` runs third-party install scripts, so the token stays out of .git/config.
          persist-credentials: false

      # Node 26's binary links libatomic, which the self-hosted runner's image lacks, so mise fails to install it.
      - name: Install libatomic1
        if: runner.os == 'Linux'
        run: ldconfig -p | grep -q libatomic.so.1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libatomic1; }

      - name: Install the tools from mise.toml
        uses: jdx/mise-action@v5

      - run: mise run setup

      # check:ci depends on lint, build and test:ci. Without --continue-on-error, mise stops the others when one
      # fails, and test:ci may die before it writes the coverage reports the scan sends.
      - id: check
        run: mise run --continue-on-error check:ci

      # The token check and the scan run after a red check:ci too, so SonarQube's quality gate on new code
      # still judges a pull request in a repo below the coverage floor. A failed setup skips check:ci, and so both.
      - id: token
        name: Check the SonarQube token
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' && hashFiles('sonar-project.properties') != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::sonar-project.properties exists, but the caller passed no SONAR_TOKEN"
            exit 1
          fi

      - name: SonarQube scan
        if: ${{ !cancelled() && steps.token.outcome == 'success' }}
        uses: kk-forge-engineering/gh-actions/sonarqube-scan@v2
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: https://sq.kk-forge.com

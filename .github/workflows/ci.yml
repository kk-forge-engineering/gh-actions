# Runs a repo's checks and, when the repo has a sonar-project.properties, its SonarQube analysis. The repo
# keeps its tools in mise.toml and the tasks `setup` and `check:ci` there. A caller with a
# sonar-project.properties passes the secret SONAR_TOKEN. This repo runs the same workflow on its own pushes.
name: CI

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
  push:
    branches: ["**"]

jobs:
  ci:
    # The kk-forge runner takes only the org's private repos, so a public repo runs on a hosted runner.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","swarm"]') || 'ubuntu-24.04' }}
    # A newer push to the same branch makes this run's result moot, and the kk-forge runner takes one job at a time.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube reads the history to tell new code from old.
          fetch-depth: 0
          # `setup` runs third-party install scripts, so the token stays out of .git/config.
          persist-credentials: false

      - name: Install the tools from mise.toml
        uses: jdx/mise-action@v5

      - run: mise run setup

      # Every task runs to its end even after one fails, so the coverage reports are complete for the scan.
      - id: check
        run: mise run --continue-on-error check:ci

      # A red check:ci still sends its reports, so SonarQube's quality gate on new code can judge a pull request.
      - id: token
        name: Check the SonarQube token
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' && hashFiles('sonar-project.properties') != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::sonar-project.properties exists, but the caller passed no SONAR_TOKEN"
            exit 1
          fi

      - name: SonarQube scan
        if: ${{ !cancelled() && steps.token.outcome == 'success' }}
        uses: kk-forge-engineering/gh-actions/sonarqube-scan@v2
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: https://sq.kk-forge.com

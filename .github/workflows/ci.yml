# Runs a repo's `mise run setup` and `check:ci`, then its SonarQube scan when it has a sonar-project.properties.
# Each repo's CI calls it (README.md). This repo also runs it on its own events below.
name: CI

on:
  workflow_call:
    inputs:
      apt-packages:
        description: Ubuntu packages the repo's tools need, separated by spaces or lines, such as `libwebkit2gtk-4.1-dev libxcb1-dev`
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        required: false
  # A branch runs CI through its PR, once per push, and SonarQube analyses it as that PR. main runs it on its own
  # push: SonarQube compares each PR with main's analysis.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  # Unless minimum_release_age is set, mise hides a version released lately, so a pin floating on its major, such as
  # go-lint "1", finds no version right after our own release. kk-forge waits on no release, here as on each machine.
  MISE_MINIMUM_RELEASE_AGE: "0"

jobs:
  ci:
    # A public repo, or a PR whose head is outside the repo, never runs on the kk-forge runner: it would run someone
    # else's code on the kk-forge server. Such a run goes to a hosted runner.
    runs-on: >-
      ${{ github.event.repository.private
      && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","swarm"]') || 'ubuntu-26.04' }}
    # A newer run of the same event and ref makes this one moot. A push never cancels a `workflow_dispatch` run on
    # its branch: the caller's dev release needs this job and would be cancelled with it.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    # The longest normal run, idea-packer's, takes about 45 minutes. A run that hangs frees its runner after an hour.
    timeout-minutes: 60
    outputs:
      token: ${{ steps.token.outcome }}
      scan: ${{ steps.scan.outcome }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube reads the history to tell new code from old.
          fetch-depth: 0
          # On a PR event this step checks out the PR head, the commit a push runs on, not GitHub's merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # `setup` runs third-party install scripts, so the token stays out of .git/config.
          persist-credentials: false

      # A PR whose head is outside the repo gets no secrets, so it skips this check and the scan. A missing token
      # fails `ci / sonar`, not `ci / ci`. Only this step and the scan get the token, but setup and check:ci run before
      # the scan and can reach it through GITHUB_ENV, GITHUB_PATH or a process left running. That is accepted: the
      # token scans and browses only the repo's own SonarQube project, and a scan job of its own costs a second runner.
      - id: token
        name: Check the SonarQube token
        if: ${{ hashFiles('sonar-project.properties') != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"

      # The apt packages a Linux job puts in before mise: libatomic1, which Node 26's binary links, dirmngr, which the
      # SonarQube scan checks the scanner's signature with, and the caller's packages for tools mise builds from source.
      # Names are checked strictly: apt reads some forms as actions or regexes, so only a name apt knows exactly gets
      # through. The cache key changes each week, so a package is at most a week old.
      - name: List the apt packages
        id: apt
        if: runner.os == 'Linux'
        env:
          APT_PACKAGES: libatomic1 dirmngr ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          # -d "" reads every line of the list; read returns 1 at its end.
          read -r -d "" -a packages <<<"$APT_PACKAGES" || true
          name='^[a-z0-9][a-z0-9.+-]*[a-z0-9.+]$'
          for package in "${packages[@]}"; do
            if [[ ! $package =~ $name ]]; then
              echo "::error title=apt-packages::'$package' is not a Debian package name. Name each package bare, without a version, an architecture, a path or a trailing -."
              exit 1
            fi
          done
          # The key names the Ubuntu release, the machine and the list. A clash would only cost a download.
          system=$({ cat /etc/os-release 2>/dev/null || true; uname -m; printf '%s\n' "${packages[@]}" | sort -u; } | cksum)
          echo "key=apt-${system%% *}-week$(($(date +%s) / 604800))" >>"$GITHUB_OUTPUT"

      # apt keeps its indexes and downloads in this folder.
      - name: Restore the apt packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}

      - name: Install the apt packages
        if: runner.os == 'Linux'
        env:
          APT_PACKAGES: libatomic1 dirmngr ${{ inputs.apt-packages }}
          APT_DIR: ${{ runner.temp }}/apt
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          read -r -d "" -a packages <<<"$APT_PACKAGES" || true
          # Ubuntu's images delete each download after the install, and apt's sandbox user cannot write to the runner's
          # folder, hence the last two options.
          apt=(-o "Dir::State::Lists=$APT_DIR/lists" -o "Dir::Cache::Archives=$APT_DIR/archives"
            -o APT::Keep-Downloaded-Packages=true -o APT::Sandbox::User=root)
          mkdir -p "$APT_DIR/lists/partial" "$APT_DIR/archives/partial"
          # A restored folder holds this week's indexes and every package, so the job reaches no mirror.
          if [[ $CACHE_HIT != true ]]; then sudo apt-get "${apt[@]}" update -qq; fi
          known=$(apt-cache "${apt[@]}" --all-names pkgnames)
          for package in "${packages[@]}"; do
            if ! grep -Fxq -- "$package" <<<"$known"; then
              echo "::error title=apt-packages::apt knows no package named exactly '$package'."
              exit 1
            fi
          done
          sudo --preserve-env=DEBIAN_FRONTEND apt-get "${apt[@]}" install -y -qq --no-install-recommends -- "${packages[@]}"
          # apt leaves root-only lock files there, which actions/cache could not read to save the folder.
          sudo chown -R "$(id -u):$(id -g)" "$APT_DIR"

      # Only the default branch saves it, as with the Go caches.
      - name: Save the apt packages
        if: ${{ runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}

      # The pins float on their major, and a cache older than a day would hold back a patch release, security fixes
      # included.
      - name: Install the tools from mise.toml
        uses: jdx/mise-action@v5
        with:
          cache_max_age_days: 1

      # Every job starts on an empty runner, so these caches keep each run from downloading and building every Go
      # module and npm package again. golangci-lint keeps its results apart from GOCACHE, so its folder is cached too.
      - id: go-paths
        name: Find the Go caches
        if: ${{ hashFiles('**/go.sum') != '' }}
        run: |
          set -euo pipefail
          command -v go >/dev/null || exit 0
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "lint=${GOLANGCI_LINT_CACHE:-${XDG_CACHE_HOME:-$HOME/.cache}/golangci-lint}"
          } >>"$GITHUB_OUTPUT"

      # Only the default branch saves it, after check:ci below. A PR's own copy, up to 750 MB, served no other PR and
      # pushed the default branch's out of the repo's 10 GB of caches.
      - id: go-cache
        name: Restore the Go modules and builds
        if: ${{ steps.go-paths.outputs.mod != '' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-paths.outputs.mod }}
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.lint }}
          # No prefix fallback: Go trusts the module and build caches without checking them, so a dependency that
          # wrote into them would outlive the go.sum change that removes it.
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}

      - name: Cache the npm downloads
        if: ${{ hashFiles('**/package-lock.json') != '' }}
        uses: actions/cache@v6
        with:
          path: ~/.npm
          # npm checks each package against the lockfile's hash, so an older cache is safe to start from.
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      - run: mise run setup

      # check:ci depends on lint, build and test:ci. Without --continue-on-error, mise stops the others when one
      # fails, and test:ci may die before it writes the coverage reports the scan sends.
      - id: check
        run: mise run --continue-on-error check:ci
        # go test reuses a cached pass while the files and env vars the test reads stay the same. It cannot see a
        # database or a file a child process reads, so a restored cache could replay a stale pass. -count=1 runs every
        # test, as on an empty runner.
        env:
          GOFLAGS: -count=1

      - name: Save the Go modules and builds
        if: ${{ steps.go-paths.outputs.mod != '' && steps.go-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-paths.outputs.mod }}
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.lint }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # The scan runs after a red check:ci too, so SonarQube's quality gate on new code still judges a pull request in a
      # repo below the coverage floor. A failed setup skips check:ci, and so the scan. A red gate fails `ci / sonar`,
      # not `ci / ci`.
      - id: scan
        name: SonarQube scan
        if: ${{ !cancelled() && steps.token.outcome == 'success' && steps.check.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 30
        uses: kk-forge-engineering/gh-actions/sonarqube-scan@v4
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: https://sq.kk-forge.com

  # `ci / sonar` is the check PRs are gated on, and it reports the ci job's scan. It reads only that job's outputs, so
  # it runs on a hosted runner for a private repo too and never waits for the kk-forge runner. The condition stays on
  # one line: GitHub missed `!cancelled()` in a folded one and skipped the job after every red check:ci.
  sonar:
    needs: ci
    if: ${{ !cancelled() && (needs.ci.outputs.token == 'failure' || needs.ci.outputs.scan == 'success' || needs.ci.outputs.scan == 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report the SonarQube scan
        env:
          TOKEN: ${{ needs.ci.outputs.token }}
          SCAN: ${{ needs.ci.outputs.scan }}
        run: |
          if [ "$TOKEN" = failure ]; then
            echo "::error::sonar-project.properties exists, but the caller passed no SONAR_TOKEN"
            exit 1
          fi
          if [ "$SCAN" != success ]; then
            echo "::error::The SonarQube scan or its quality gate failed. The SonarQube scan step of the ci job shows why."
            exit 1
          fi
          echo "The SonarQube scan passed its quality gate."

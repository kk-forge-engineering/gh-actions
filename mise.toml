[tools]
actionlint = "1"
shellcheck = "0"
# The Node that actions/github-script@v9 runs gate-report.ts on.
node = "24"

[tasks.setup]
description = "Install every dependency"
run = "npm ci"

[tasks.lint]
description = "Every linter"
depends = ["lint:actionlint", "lint:tsc"]

# actionlint also runs shellcheck over every `run:` script in the workflows.
[tasks."lint:actionlint"]
description = "Lint the workflows and their scripts"
run = "actionlint"

[tasks."lint:tsc"]
description = "Check the TypeScript types"
run = "npx --no tsc"

[tasks.test]
description = "Every test"
run = "node --test"

[tasks.check]
description = "Everything that must be green before a commit"
depends = ["lint", "test"]

[tasks."check:ci"]
description = "check, as CI runs it"
depends = ["lint", "test"]

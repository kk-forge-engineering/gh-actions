[tools]
actionlint = "1"
shellcheck = "0"
# The Node that actions/github-script@v9 runs gate-report.js on.
node = "24"

[tasks.setup]
description = "Install every dependency (none here)"
run = "true"

# actionlint also runs shellcheck over every `run:` script in the workflows.
[tasks.lint]
description = "Every linter"
run = "actionlint"

[tasks.test]
description = "Every test"
run = "node --test"

[tasks.check]
description = "Everything that must be green before a commit"
depends = ["lint", "test"]

[tasks."check:ci"]
description = "check, as CI runs it"
depends = ["lint", "test"]
